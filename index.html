<!DOCTYPE html>
<!-- 上面这行告诉浏览器：这是一个 HTML5 网页 -->
<html lang="zh-CN">
<!-- <html> 是所有网页的最外层，lang 表示页面语言是中文 -->

<head>
  <!-- <head> 里放的是"给浏览器看的设置"，用户看不到 -->
  <meta charset="UTF-8">
  <!-- charset 让中文能正常显示，不写这行中文会乱码 -->
  <title>我是 Rong-rwm</title>
  <!-- <title> 是浏览器标签页上显示的文字 -->

  <!-- ===== CSS 从这里开始 ===== -->
  <!-- <style> 标签里写的是"样式"，管网页长什么样 -->
  <style>
    /* body 是整页的"皮肤"，管背景、字体、留白 */
    body {
      background-color: #ffeaa7;                 /* 背景色：浅灰 */
      font-family: "Microsoft YaHei", sans-serif; /* 字体 */
      max-width: 600px;                           /* 内容最宽 600 像素 */
      margin: 40px auto;                          /* 上下留白40，左右自动居中 */
      padding: 24px;                              /* 内容四周留白 */
    }

    /* h1 是名字大标题 */
    h1 {
      color: #2c3e50;         /* 深蓝灰 */
      font-size: 32px;        /* 字号 32 像素 */
      text-align: center;     /* 文字居中 */
    }

    /* p 是所有段落 */
    p {
      color: #555;            /* 深灰 */
      line-height: 1.6;       /* 行高，让文字不挤在一起 */
    }

    /* h2 是小标题 */
    h2 {
      color: #e74c3c;                  /* 红色 */
      border-bottom: 2px solid #eee;   /* 下边一条浅灰线 */
      padding-bottom: 8px;             /* 线和文字之间留白 */
    }

    /* a 是链接 */
    a {
      color: #2980b9;         /* 蓝色 */
    }
  </style>
  <!-- ===== CSS 到这里结束 ===== -->
</head>

<body>
  <!-- <body> 里放的是"用户真正看到的内容"，下面的东西都会显示在网页上 -->

  <!-- 一级标题：你的名字 -->
  <h1>我是 容伟铭</h1>

  <!-- 一句自我介绍 -->
  <p>一个从零开始、专注 Vue3 前端开发的大学生。</p>

  <!-- 二级标题 -->
  <h2>我正在学的东西</h2>

  <!-- 无序列表（前面有小圆点） -->
  <ul>
    <li>HTML（网页结构）</li>
    <li>CSS（网页样式）</li>
    <li>JavaScript（网页交互）</li>
    <li>Vue3（前端框架）</li>
    <li>TypeScript</li>

  </ul>

  <!-- 下面这个列表是"空的"，JS 会用循环自动填满它 -->
  <h2>用 JS 循环生成的列表</h2>
  <ul id="skillList"></ul>

  <!-- if/else 和对象演示 -->
  <h2>条件判断和对象</h2>
  <p id="greeting"></p>
  <p id="aboutMe"></p>

  <!-- 一个可以点击的链接，href 是跳转地址 -->
  <p>我的 GitHub：
    <a href="https://github.com/Rong-rwm" target="_blank">github.com/Rong-rwm</a>
  </p>

  <!-- 水平分割线，就是一条横线 -->
  <hr>

  <!-- 脚注：记录进度 -->
  <p>📅 Day 4 · 会写 JS 了</p>

  <!-- 一个按钮。onclick 意思是"用户点击时，执行 sayHello 这个函数" -->
  <button onclick="sayHello()">点我一下</button>

  <!-- 这一行文字有个 id 叫 myText，JS 靠这个 id 找到它 -->
  <p id="myText">这是还没被改过的文字</p>

  <!-- 第二个按钮，点击会执行 changeText 函数 -->
  <button onclick="changeText()">点我改上面的文字</button>

  <!-- ===== JavaScript 从这里开始 ===== -->
  <!-- <script> 标签里写的是 JS 代码，让网页"动起来" -->
  <script>
    // 这是一个"函数"：一段起好名字、可以反复调用的代码块
    function sayHello() {
      // alert() 会弹出一个提示框
      alert("星沉爱意落幕");
    }

    // 第二个函数：改页面上某个元素的文字
    function changeText() {
      // let 是"声明变量"，把找到的元素存进变量 text 里
      let text = document.getElementById("myText");
      // .innerText 就是"这个元素显示的文字"，= 号是"改成"
      text.innerText = "星沉爱意落幕";
    }

    // ===== 1. 数组：一个能装"一堆东西"的盒子 =====
    // 用方括号 [] 装，用逗号隔开每一项
    let skills = ["HTML", "CSS", "JavaScript", "Vue3", "TypeScript","rong"];

    // ===== 2. for 循环：把数组里的东西一个个拿出来 =====
    let listHtml = "";  // 空字符串，准备往里拼 HTML
    for (let i = 0; i < skills.length; i++) {
      // skills[i] = 数组里第 i 个（从 0 开始数）
      // 把每一行 <li> 拼接到 listHtml 后面
      listHtml = listHtml + "<li>" + skills[i] + "</li>";
    }
    // 把拼好的 HTML 一次性塞进那个空的 <ul> 里
    document.getElementById("skillList").innerHTML = listHtml;

    // ===== 3. if/else：条件判断（"如果...就...否则..."） =====
    // new Date().getHours() 拿到现在是几点（0 到 23）
    let hour = new Date().getHours();
    let greeting = "";
    if (hour < 12) {
      // 如果现在是上午
      greeting = "早上好";
    } else if (hour < 18) {
      // 否则如果现在是下午
      greeting = "下午好";
    } else {
      // 否则（就是晚上）
      greeting = "晚上好";
    }
    document.getElementById("greeting").innerText = greeting + "，容伟铭！";

    // ===== 4. 对象：一个带"标签"的数据包 =====
    // 用大括号 {} 包起来，"标签: 值"用逗号隔开
    let me = {
      name: "容伟铭",
      direction: "前端",
      skill: "Vue3",
      girl:"nobody"
    };
    // 用点号 . 取出对象里的某个值
    document.getElementById("aboutMe").innerText =
      me.name + "，方向是" + me.direction + "，主攻" + me.skill + "，喜欢的女孩是" + me.girl;
  </script>
  <!-- ===== JavaScript 到这里结束 ===== -->
</body>

</html>
